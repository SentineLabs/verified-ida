[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "verified-ida-harness"
dynamic = ["version"]
description = "Verified, persistent model-to-IDA reverse-engineering harness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "eval_type_backport",
  "openai-agents==0.20.0",
  "pydantic>=2.8,<3",
  "unicorn>=2.1,<3",
]

[project.scripts]
verified-ida = "verified_ida.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["verified_ida*"]

[tool.setuptools.dynamic]
version = {attr = "verified_ida.version.__version__"}

